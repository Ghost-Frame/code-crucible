[package]
name = "code-crucible"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Protocol enforcer for AI coding agents -- structured reasoning, verification, and skill evolution"
repository = "https://github.com/Ghost-Frame/code-crucible"
homepage = "https://github.com/Ghost-Frame/code-crucible"
readme = "README.md"
keywords = ["ai", "agent", "code-quality", "protocol", "verification"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "code-crucible"
path = "src/main.rs"

[features]
default = []
skill-backend = ["dep:reqwest"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
walkdir = "2"
ignore = "0.4"
thiserror = "1"
dirs = "5"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-c = "0.23"
tree-sitter-json = "0.23"
reqwest = { version = "0.12", features = ["json", "blocking"], optional = true }

[dev-dependencies]
tempfile = "3"
